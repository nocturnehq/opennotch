name: Build OpenNotch for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: windows
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Windows self-test
        working-directory: windows
        run: python selftest_win.py
      - name: Build standalone OpenNotch.exe
        working-directory: windows
        run: python build_exe.py
      - name: Upload OpenNotch.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNotch-Windows
          path: windows/dist/OpenNotch.exe
